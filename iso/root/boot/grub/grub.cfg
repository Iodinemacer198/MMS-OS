set timeout=3
set default=0

insmod fat
insmod part_gpt
insmod part_msdos
insmod search_fs_file
search --no-floppy --file --set=root /boot/kernel.bin

if loadfont unicode; then
    terminal_output gfxterm
fi

menuentry "MMS-OS (modern UEFI/BIOS)" {
    set gfxpayload=1024x768x32,auto
    multiboot /boot/kernel.bin
    boot
}
